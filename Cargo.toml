[package]
name = "controller-test"
version = "1.0.0-alpha"
edition = "2021"
rust-version = "1.80"
description = "Controller Test: mostra na tela, em tempo real, cada botao, gatilho e analogico do RG52 Mini (dArkOS)"
license = "MIT"

[lib]
name = "controller_test"
path = "src/lib.rs"

[[bin]]
name = "controller-test"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = ["ui"]
# Interface grafica (SDL2). Sem ela so a biblioteca compila: cargo test --no-default-features
ui = ["dep:sdl2"]

[dependencies]
ab_glyph = "0.2"
sdl2 = { version = "0.37", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
